[project]
name = "pdsx-workspace"
version = "0.0.0"
description = "workspace root for pdsx packages"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-sugar",
    "ruff>=0.12.0",
    "prek>=0.2.0",
    "ty>=0.0.1a25",
    "mdxify>=0.2.34",
    "pytest-mock>=3.15.1",
    "pdsx",
    "pdsx-mcp",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pdsx = { workspace = true }
pdsx-mcp = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::pydantic._internal._generate_schema.UnsupportedFieldAttributeWarning",
]

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "COM812",
    "PLR0913", # Too many arguments
    "SIM102",  # Dont require combining if statements
]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "PIE", # flake8-pie
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"tests/**/*.py" = ["S101"]       # Allow assert in tests

[tool.coverage.run]
source = ["packages/pdsx/src", "packages/pdsx-mcp/src"]
omit = ["tests/*", "sandbox/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ty.src]
include = ["packages/pdsx/src", "packages/pdsx-mcp/src", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    ".git",
    "dist",
    "sandbox",
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
unknown-argument = "ignore"
no-matching-overload = "ignore"
