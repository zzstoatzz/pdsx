fail_fast: false

repos:
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: type-check
        name: type check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: mdxify
        name: generate API docs
        entry: uv run mdxify --all --root-module pdsx --output-dir docs/api-reference --include-internal
        language: system
        types: [python]
        pass_filenames: false

      # a malformed plugin manifest fails silently at install time, so it has
      # to be caught here rather than at runtime — and CI's path filter skips
      # these files entirely
      - id: sync-plugin-version
        name: sync plugin version from git tag
        entry: uv run python scripts/sync_plugin_version.py
        language: system
        pass_filenames: false
        always_run: true

      - id: plugin-manifests
        name: validate plugin manifests
        entry: uv run pytest tests/test_plugin_manifests.py -q
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: prevent commits to main
        args: [--branch, main]
