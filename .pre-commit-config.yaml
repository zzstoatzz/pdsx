fail_fast: false

repos:
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: type-check
        name: type check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: mdxify
        name: generate API docs
        entry: uv run mdxify --all --root-module pdsx --output-dir docs/api-reference --include-internal
        language: system
        types: [python]
        pass_filenames: false

      # a malformed plugin manifest fails silently at install time, so it has
      # to be caught here rather than at runtime — and CI's path filter skips
      # these files entirely
      - id: sync-plugin-version
        name: sync plugin version from git tag
        entry: uv run python scripts/sync_plugin_version.py
        language: system
        pass_filenames: false
        always_run: true

      - id: plugin-manifests
        name: validate plugin manifests
        entry: uv run pytest tests/test_plugin_manifests.py -q
        language: system
        pass_filenames: false
        always_run: true
